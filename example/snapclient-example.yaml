esphome:
  name: snapclient-example
  friendly_name: Snapclient Example

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  # `audio_timing` is listed because snapclient AUTO_LOADs it, and a `components:` filter
  # hides everything it does not name -- omitting the filter entirely also works and
  # additionally exposes wifi_bssid_select and wifi_tools.
  - source: github://W-Floyd/esphome-snapcast
    components: [snapclient, audio_timing]
  # Developing against a checkout instead? Swap the above for the working tree, so edits
  # are picked up without pushing:
  # - source:
  #     type: local
  #     path: ../components

  # Forked speaker stack, pending upstream. Adds `Speaker::buffered_bytes(size_t &)`, so
  # the audio sitting between our push point and the DAC is READABLE. Everything
  # downstream already computes that count and throws it away
  # (`has_buffered_data()` returns `available() > 0`), and its absence is why a pipeline
  # restart at an unobserved fill leaves playback 100-250 ms offset with every sync metric
  # still reading ~0: the error is measured against a prediction built from the same wrong
  # accounting.
  #
  # An external component overrides the built-in of the same name, so only these six are
  # replaced and the installed ESPHome is untouched. The branch tracks a RELEASE TAG
  # (currently 2026.8.1), so it pairs with a stable CLI; `dev` is not usable as a base,
  # because its components call codegen helpers absent from any released esphome. Drop
  # this block once the change lands upstream (see TODO.md).
  - source:
      type: git
      url: https://github.com/W-Floyd/esphome
      ref: speaker-buffered-bytes
    components: [speaker, i2s_audio, mixer, audio, media_source, speaker_source]

# The Snapcast client hub: connection, time sync, decode, sync scheduling
snapclient:
  id: snap
  server: 192.168.1.10
  # port: 1704
  # name: Kitchen Speaker      # display name basis on the server (default: node name)
  # buffer_size: 524288        # decoded PCM buffer (bytes), PSRAM-preferred
  # flac: true                 # snapserver's default codec; pcm always works
  # time_sync_interval: 1s
  # hard_resync_threshold: 50ms
  # stream_idle_timeout: 3s

# The player: bridges synchronized PCM into the speaker media player pipeline
media_source:
  - platform: snapclient
    id: snap_source
    snapclient_id: snap
    # static_delay: 0ms        # per-device latency trim (like snapclient --latency)

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO5
    i2s_bclk_pin: GPIO6

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO7
    sample_rate: 48000  # match the snapserver stream rate for exact sync feedback
    channel: stereo
    buffer_duration: 100ms

media_player:
  - platform: speaker_source
    name: Media Player
    media_pipeline:
      speaker: my_speaker
      sources:
        - snap_source
      # Keep the pipeline at the stream's native format so the DAC feedback used for
      # synchronization counts frames 1:1 with what the snapclient source pushes.
      sample_rate: 48000
      num_channels: 2
