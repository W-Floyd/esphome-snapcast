# Complete reference: every option this repo adds. Commented-out lines carry the real
# default, so uncommenting one never changes behaviour; the few options that have no
# default are marked `unset`, and uncommenting those does change behaviour.
# Minimal config: README.md. Why the timing options are what they are: TIMING.md.

esphome:
  name: snapclient-example
  friendly_name: Snapclient Example

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:                            # the default buffer_size and Opus both want it
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  # snapclient AUTO_LOADs audio_timing, and a `components:` filter hides anything it
  # does not name. Omit the filter to get all four.
  - source: github://W-Floyd/esphome-snapcast
    components: [snapclient, audio_timing, wifi_tools, wifi_bssid_select]
  # Working tree instead, so edits apply without pushing:
  # - source: {type: local, path: ../components}

  # Forked speaker stack: adds `Speaker::buffered_bytes()`, letting the sync engine see
  # the audio between our push point and the DAC. Without it a pipeline restart at an
  # unobserved fill leaves playback 100-250 ms out with every metric reading ~0. An
  # external component overrides the built-in of the same name, so only these six are
  # replaced. Tracks a RELEASE TAG (`dev` needs codegen helpers no stable CLI has).
  # Drop once upstream — see TODO.md.
  - source:
      type: git
      url: https://github.com/W-Floyd/esphome
      ref: speaker-buffered-bytes
    components: [speaker, i2s_audio, mixer, audio, media_source, speaker_source]

# Connection, time sync, decode, sync scheduling
snapclient:
  id: snap
  server: 192.168.1.10            # omit to discover via mDNS
  # port: 1704
  # name: Kitchen Speaker         # unset: Hello HostName, defaults to the node name
  # buffer_size: 524288           # decoded PCM ring, bytes; min 65536
  # flac: true                    # snapserver's default codec
  # opus: false                   # +87 KB flash, ~160 KB RAM: PSRAM only
  # time_sync_interval: 250ms     # idle uses max(this, 2s)
  # sync_deadband: 128us          # splice servo engages here, disengages at half
  # converge_fine: 2ms            # coarse->fine handoff; 2*deadband < this < hard_resync
  # hard_resync_threshold: 50ms   # beyond this, drop chunks / insert silence
  # channel_mode: stereo          # stereo | left | right | mono
  # phase_invert: none            # none | left | right | both
  # pause_behavior: allow         # allow | resume | ignore
  # keepalive_hold: never         # or a duration; never keeps the speaker always ready
  # stream_idle_timeout: 3s       # ends the stream once disconnected
  # tsf_sync: false               # share one 802.11 timebase between same-AP clients
  # timing_diagnostics: false     # per-chunk RAW lines for scripts/raw-sync.py
  # rate_lock:                    # unset. S3 only: steers the I2S divider rather than
  #   i2s_audio_id: i2s_out         # splicing. The bus BY ID — ports are assigned, not
                                    # ordered, so a PDM mic would renumber this one.

# Bridges synchronized PCM into the speaker pipeline
media_source:
  - platform: snapclient
    id: snap_source
    snapclient_id: snap
    # static_delay: 0ms           # per-device trim, like snapclient --latency

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO5
    i2s_bclk_pin: GPIO6

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO7
    sample_rate: 48000            # match the stream: nothing in this path resamples
    channel: stereo
    buffer_duration: 100ms

media_player:
  - platform: speaker_source
    name: Media Player
    media_pipeline:
      speaker: my_speaker
      sources: [snap_source]
      sample_rate: 48000          # mismatch = speaker reconfigure + dropped write
      num_channels: 2

# All entities persist locally and override the matching hub option above.
select:
  - platform: snapclient
    type: channel_mode            # Stereo | Left | Right | Mono
    snapclient_id: snap
    name: Channel Mode
    # restore_value: true
  - platform: snapclient
    type: phase                   # fixes an out-of-phase driver in software
    snapclient_id: snap
    name: Phase
    # mono_dac: false             # true when the DAC sums L+R
  - platform: snapclient
    type: pause_behavior          # Allow | Resume | Ignore
    snapclient_id: snap
    name: Pause Behavior
  - platform: snapclient
    type: server                  # "Automatic" + each mDNS-discovered snapserver
    snapclient_id: snap
    name: Server
  - platform: wifi_bssid_select
    name: Access Point            # a preference, not a hard pin

number:
  - platform: snapclient
    type: server_latency          # this client's latency ON the server; not persisted
    snapclient_id: snap
    name: Server Latency

text:
  - platform: snapclient          # manual "host" or "host:port"; beats every other
    snapclient_id: snap           # server setting
    name: Server Override
    # restore_value: true

text_sensor:
  - platform: snapclient
    type: stream_format           # "48000 Hz, 16 bit, 2 ch" — check it matches above
    snapclient_id: snap
    name: Stream Format
  - platform: snapclient
    type: tsf_role                # Leader | Follower | Inactive
    snapclient_id: snap
    name: TSF Role
  - platform: snapclient
    type: stream_name             # also stream_title, stream_artist, stream_album
    snapclient_id: snap
    name: Stream Name

wifi_tools:
  diagnostics:                    # omit entirely to drop the polling component
    update_interval: 10s          # `never` keeps set_max_tx_power without polling
    # dump_statistics: false      # verbose; suspected of stalling the serial log
