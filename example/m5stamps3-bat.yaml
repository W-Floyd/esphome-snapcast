# Snapclient on an M5Stamp S3 BAT (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM).
#
# Same DAC pinout as the SuperMini build, so an existing board swaps in directly:
#
#   GPIO4  -> LCK  (word select / LR clock)
#   GPIO5  -> BCK  (bit clock)
#   GPIO6  -> DIN  (data)
#
# The onboard WS2812 is NOT on a plain GPIO here -- it hangs off the M5PM1 PMIC
# (PY_LED_PP / PY_LED_EN), so it is currently unwired. See pin_led below.
#
# Everything not board-specific is in snapclient-base.yaml.
substitutions:
  name: snapclient-stamps3
  friendly_name: Snapclient StampS3

  board: m5stack-stamps3
  flash_size: 8MB
  # N8R8's 8 MB PSRAM is OCTAL. Setting quad here boots but leaves PSRAM unusable,
  # and the decoded-PCM ring buffer is sized expecting it.
  psram_mode: octal
  psram_speed: 80MHz

  pin_lrclk: GPIO4
  pin_bclk: GPIO5
  pin_dout: GPIO6
  # The WS2812 hangs off the M5PM1 (PY_LED_PP / PY_LED_EN), not a plain GPIO, so the
  # base's esp32_rmt_led_strip cannot drive it. Pointed at an unused pad; the LED needs
  # the m5pm1 neopixel platform instead, which is not wired up here.
  # NOTE GPIO48/47 are the M5PM1's I2C bus on this board -- do not reuse them.
  pin_led: GPIO2

packages:
  base: !include snapclient-base.yaml

# The DAC needs 5 V, and on this board EXT_5V is gated by the M5PM1 power-management IC
# rather than being a passive USB VBUS tap: it is driven by 5VOUT_EN, which is the PMIC's
# own GPIO1. Sourced from USB-C or DC 5 V -- if the board is powered only through the 3V3
# interface, EXT_5V cannot output at all.
#
# Confirmed on hardware: DRV 0x13 read back 0x1F, i.e. all five PMIC GPIOs default to
# OPEN-DRAIN, which cannot source a rail -- clearing bit 1 to push-pull is the write that
# actually matters. The per-register logging below is kept for that reason: if a future
# board revision ships different defaults, the before/after values say so immediately.
#
# Done with four register writes rather than an external component: the available one
# (GitNik1/esphome-m5pm1) includes binary_sensor and output headers unconditionally
# without auto-loading them, so it fails to compile unless those platforms happen to be
# configured. Register map from m5stack/M5PM1 (M5PM1.h).
i2c:
  - id: pmic_bus
    sda: GPIO48   # NOTE: the PMIC's I2C bus. Not free GPIO -- do not reuse for the DAC.
    scl: GPIO47
    # 100k, not 400k: at 400k every transaction to the PMIC NAKed. Bus recovery also
    # runs at boot here, so which of the two mattered is not isolated -- 100k is plenty
    # for four register writes taken once at startup.
    frequency: 100kHz
    scan: true         # logs every address that acks, at boot

esphome:
  on_boot:
    # After the i2c bus is up, before wifi/audio start needing the rail
    - priority: 600
      then:
        - lambda: |-
            static constexpr uint8_t ADDR = 0x6E;
            static constexpr uint8_t GPIO1 = 1 << 1;
            auto *bus = id(pmic_bus);
            // Read-modify-write: every one of these registers packs all five PMIC GPIOs,
            // so a blind write would reconfigure the LED enable and the wake pin too.
            auto rmw = [bus](uint8_t reg, uint8_t mask, uint8_t bits) -> bool {
              uint8_t r = reg;
              uint8_t cur = 0;
              i2c::ErrorCode e = bus->write(ADDR, &r, 1);
              if (e != i2c::ERROR_OK) {
                ESP_LOGE("m5pm1", "reg 0x%02X: address write failed (err %d)", reg, (int) e);
                return false;
              }
              e = bus->read(ADDR, &cur, 1);
              if (e != i2c::ERROR_OK) {
                ESP_LOGE("m5pm1", "reg 0x%02X: read failed (err %d)", reg, (int) e);
                return false;
              }
              uint8_t buf[2] = {reg, static_cast<uint8_t>((cur & ~mask) | (bits & mask))};
              e = bus->write(ADDR, buf, 2);
              if (e != i2c::ERROR_OK) {
                ESP_LOGE("m5pm1", "reg 0x%02X: write 0x%02X failed (err %d)", reg, buf[1], (int) e);
                return false;
              }
              ESP_LOGI("m5pm1", "reg 0x%02X: 0x%02X -> 0x%02X", reg, cur, buf[1]);
              return true;
            };
            // FUNC0 0x16 bits[3:2] = GPIO1 function, 00 = plain GPIO (11 would be ADC1)
            bool ok = rmw(0x16, 0b1100, 0b0000);
            // DRV 0x13 bit1 = 0 -> push-pull (1 would be open-drain, which cannot source)
            ok = rmw(0x13, GPIO1, 0) && ok;
            // MODE 0x10 bit1 = 1 -> output
            ok = rmw(0x10, GPIO1, GPIO1) && ok;
            // OUT 0x11 bit1 = 1 -> high, enabling EXT_5V
            ok = rmw(0x11, GPIO1, GPIO1) && ok;
            if (ok) {
              ESP_LOGI("m5pm1", "EXT_5V enabled for the DAC");
            } else {
              ESP_LOGE("m5pm1", "Failed to enable EXT_5V; the DAC has no rail and will be silent");
            }
