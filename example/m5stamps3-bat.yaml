# Snapclient on an M5Stamp S3 BAT (ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM).
#
# Same DAC pinout as the SuperMini build, so an existing board swaps in directly:
#
#   GPIO4  -> LCK  (word select / LR clock)
#   GPIO5  -> BCK  (bit clock)
#   GPIO6  -> DIN  (data)
#
# The onboard WS2812 is NOT on a plain GPIO here -- it hangs off the M5PM1 PMIC
# (PY_LED_PP / PY_LED_EN), so it is currently unwired. See pin_led below.
#
# Everything not board-specific is in snapclient-base.yaml.
substitutions:
  name: snapclient-stamps3
  friendly_name: Snapclient StampS3

  board: m5stack-stamps3
  flash_size: 8MB
  # N8R8's 8 MB PSRAM is OCTAL. Setting quad here boots but leaves PSRAM unusable,
  # and the decoded-PCM ring buffer is sized expecting it.
  psram_mode: octal
  psram_speed: 80MHz

  pin_lrclk: GPIO4
  pin_bclk: GPIO5
  pin_dout: GPIO6
  # The WS2812 hangs off the M5PM1 (PY_LED_PP / PY_LED_EN), not a plain GPIO, so the
  # base's esp32_rmt_led_strip cannot drive it. Pointed at an unused pad; the LED needs
  # the m5pm1 neopixel platform instead, which is not wired up here.
  # NOTE GPIO48/47 are the M5PM1's I2C bus on this board -- do not reuse them.
  pin_led: GPIO2

packages:
  base: !include snapclient-base.yaml

# The DAC needs 5 V, and on this board EXT_5V is gated by the M5PM1 power-management IC
# rather than being a passive USB VBUS tap: it is driven by 5VOUT_EN, which is the PMIC's
# own GPIO1. Sourced from USB-C or DC 5 V -- if the board is powered only through the 3V3
# interface, EXT_5V cannot output at all.
#
# The DAC's 5 V comes from U6, an SY7088 boost converter, whose EN pin is driven by the
# net 5VOUT_EN. Per the board schematic 5VOUT_EN lands on PY32_PMIC pin 17, "G1_IRQout_ADC"
# -- so the enable really is PMIC GPIO1, driven push-pull high. R18 is a 100K pulldown on
# EN, so the boost is OFF until we drive it.
#
# Two traps, both of which cost a debugging round:
#
#  1. The published pinmap table lists GPIO1 as "CHG_EN_PP". That is wrong: CHG_EN has its
#     own dedicated PMIC pin 2. Trust the schematic.
#  2. PWR_CFG bit 3 (BOOST_EN, what the vendor library's setBoostEnable() writes) drives
#     PMIC pin 10, BOOST5V_EN_PP -- which has NO net attached on this board. Calling it
#     does nothing here. It is not the 5 V enable.
#
# The rail appears on header J3 pin 7, "EXT_5V_OUT" (J3 pin 6 is GND, pin 8 is G6). Note
# that 5VIN on J5 is an INPUT -- it feeds SYS_VIN through a CH213K ideal diode and cannot
# source -- and BTB SYS_VBUS is the pre-boost rail, roughly VBAT or VIN, not 5 V.
#
# There is no ADC on EXT_5V_OUT (the PMIC's "5VINOUT" regs 0x26/0x27 sit on VUSB_ADC, the
# USB input divider), so firmware cannot confirm the rail came up. Measure J3 pin 7.
#
# Register map from m5stack/M5PM1 (M5PM1.h).
i2c:
  - id: pmic_bus
    sda: GPIO48   # NOTE: the PMIC's I2C bus. Not free GPIO -- do not reuse for the DAC.
    scl: GPIO47
    # 100k, not 400k: at 400k every transaction to the PMIC NAKed. Bus recovery also
    # runs at boot here, so which of the two mattered is not isolated -- 100k is plenty
    # for a handful of register writes taken once at startup.
    frequency: 100kHz
    scan: true

esphome:
  on_boot:
    # After the i2c bus is up, before wifi/audio start needing the rail
    - priority: 600
      then:
        - lambda: |-
            static constexpr uint8_t ADDR = 0x6E;
            static constexpr uint8_t GPIO1 = 1 << 1;
            auto *bus = id(pmic_bus);
            // Read-modify-write: these registers pack all five PMIC GPIOs and, in
            // HOLD_CFG's case, the 3V3 LDO -- a blind write could brown out the
            // ESP32 itself or reconfigure the NeoPixel and wake pins.
            auto rmw = [bus](uint8_t reg, uint8_t mask, uint8_t bits) -> bool {
              uint8_t r = reg, cur = 0;
              if (bus->write(ADDR, &r, 1) != i2c::ERROR_OK ||
                  bus->read(ADDR, &cur, 1) != i2c::ERROR_OK) {
                ESP_LOGE("m5pm1", "reg 0x%02X: read failed", reg);
                return false;
              }
              uint8_t buf[2] = {reg, static_cast<uint8_t>((cur & ~mask) | (bits & mask))};
              if (bus->write(ADDR, buf, 2) != i2c::ERROR_OK) {
                ESP_LOGE("m5pm1", "reg 0x%02X: write 0x%02X failed", reg, buf[1]);
                return false;
              }
              ESP_LOGI("m5pm1", "reg 0x%02X: 0x%02X -> 0x%02X", reg, cur, buf[1]);
              return true;
            };
            // FUNC0 0x16 bits[3:2] = GPIO1 function, 00 = plain GPIO (11 would be ADC1)
            bool ok = rmw(0x16, 0b1100, 0b0000);
            // DRV 0x13 bit1 = 0 -> push-pull. This is the write that matters: all five
            // GPIOs default to open-drain (0x1F on hardware), which cannot drive the
            // boost EN pin high against its 100K pulldown.
            ok = rmw(0x13, GPIO1, 0) && ok;
            // MODE 0x10 bit1 = 1 -> output
            ok = rmw(0x10, GPIO1, GPIO1) && ok;
            // OUT 0x11 bit1 = 1 -> high, enabling the boost
            ok = rmw(0x11, GPIO1, GPIO1) && ok;
            // HOLD_CFG 0x07 bit1 = hold GPIO1's output state. The register auto-clears
            // on reset/download/shutdown, so it is set here every boot rather than once.
            ok = rmw(0x07, GPIO1, GPIO1) && ok;
            if (ok) {
              ESP_LOGI("m5pm1", "5V boost enabled (EXT_5V_OUT, J3 pin 7)");
            } else {
              ESP_LOGE("m5pm1", "Failed to enable the 5V boost; the DAC will be silent");
            }
