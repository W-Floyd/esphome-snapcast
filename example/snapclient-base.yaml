# Shared config for a real multiroom speaker: Snapcast mixed with ducked HA
# announcements. A `mixer` blends two source speakers into the DAC — the media pipeline
# plays Snapcast plus URLs, the announcement pipeline plays over the top, so Snapcast
# stays connected and in sync throughout.
#
# Board files include this as a package and supply: name, friendly_name, board,
# flash_size, psram_mode, psram_speed, pin_lrclk, pin_bclk, pin_dout, pin_led.
# Complete option list: snapclient-example.yaml.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true       # a fleet can share this config and stay distinct

esp32:
  board: ${board}
  flash_size: ${flash_size}
  framework:
    type: esp-idf
    sdkconfig_options:
      # Raises the PHY ceiling independently of wifi.output_power, which esp32 otherwise
      # derives from it as max(10, min(20, ceil(output_power))). We want a low boot power
      # with a high ceiling, so the runtime number below can explore past 10 dBm.
      CONFIG_ESP_PHY_MAX_WIFI_TX_POWER: "20"

psram:
  mode: ${psram_mode}
  speed: ${psram_speed}

logger:
  level: DEBUG

api:
  # TEST HOOK: drain the pipeline on demand so the starvation path can be exercised deliberately.
  # The natural event is upstream and group-wide, so it cannot be aimed at ONE device -- and one
  # device starving alone is precisely the case that plants inter-device skew.
  actions:
    - action: inject_starvation
      variables:
        ms: int
      then:
        - lambda: 'id(snap)->inject_starvation(ms);'

ota:
  - platform: esphome

# output_power is a FLOOR set per board, so board files add their own wifi: block, which
# merges with this. esp32 has no default, so omitting it leaves the radio at the PHY
# maximum: that left two of four SuperMinis dropping every chunk and never recovering.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  # A `components:` filter hides anything it does not name, including the AUTO_LOADed
  # clock_sync.
  # - source: github://W-Floyd/esphome-snapcast
  #   components: [snapclient, clock_sync, wifi_tools, wifi_bssid_select]
  - source: {type: local, path: ../components}   # working tree instead

  # Forked speaker stack: adds `Speaker::buffered_bytes()`, letting the sync engine see
  # the audio between our push point and the DAC. Drop once upstream — see TODO.md.
  # refresh: always while the branch is moving -- the default is 1d, so a force-pushed fork
  # keeps building against a stale cached copy and fails on symbols that are already there.
  # - source:
  #     type: git
  #     url: https://github.com/W-Floyd/esphome
  #     ref: speaker-render-latency
  #   refresh: always
  #   components: [speaker, i2s_audio, mixer, audio, media_source, speaker_source]
  # Local checkout instead -- flash.sh --docker mounts ../esphome at /esphome, and this repo
  # at /config, so this one relative path is correct on the host and in the container alike:
  - source: {type: local, path: ../../esphome/esphome/components}
    components: [speaker, i2s_audio, mixer, audio, media_source, speaker_source]

snapclient:
  id: snap
  # server: 192.168.1.10        # omit to discover via mDNS
  # Fixed multiroom players: the stream decides, not whatever last touched the entity.
  # `ignore` refuses PAUSE/STOP so there is no gap at all — including a deliberate stop,
  # so a "turn everything off" automation cannot silence these. It also cannot strand one
  # idle until somebody presses play, which is what happened before this existed.
  pause_behavior: ignore
  rate_lock:
    i2s_audio_id: i2s_out       # by id: a PDM mic would take port 0 and renumber this
  tsf_sync: true                # same-AP clients share one server→TSF mapping
  timing_diagnostics: false     # ~38 log lines/s/device; on to measure, off to listen

media_source:
  - platform: snapclient        # synchronized multiroom audio
    id: snap_source
    snapclient_id: snap
    # static_delay: 0ms         # per-device latency trim
  - platform: audio_http        # HA "play media", radio streams
    id: media_http_source
  - platform: audio_http        # HA announcements / TTS
    id: announcement_http_source

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_lrclk}
    i2s_bclk_pin: ${pin_bclk}

speaker:
  - platform: i2s_audio
    id: dac_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${pin_dout}
    sample_rate: 44100
    channel: stereo
    buffer_duration: 100ms
    timeout: never              # the 500 ms default turns a hiccup into a rebuild
  - platform: mixer
    output_speaker: dac_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      # The snapclient writes here, so this is the timeout that matters: on the default
      # the mixer rebuilds and returns at a DIFFERENT fill (observed 250 -> 100 ms,
      # permanent, sync error still ~0 — i.e. silently offset from its peers).
      - id: media_mixer_input
        timeout: never

media_player:
  - platform: speaker_source
    id: player
    name: Media Player
    volume_initial: 0.6
    media_pipeline:
      speaker: media_mixer_input
      sources: [snap_source, media_http_source]
      # Must match the server — nothing here resamples. Check with Stream Format below;
      # this said 48000 against a server streaming 44100.
      sample_rate: 44100
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_mixer_input
      sources: [announcement_http_source]
      # Must match the media pipeline exactly: the mixer neither resamples nor up-mixes.
      # At 48000/mono against 44100/stereo it rejected every announcement, stuck the
      # player in ANNOUNCING, and allocated 1742 ring buffers in two minutes.
      sample_rate: 44100
      num_channels: 2
    # Duck rather than pause, so Snapcast keeps playing and stays in sync
    on_announcement:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 20, duration: 0.0s}
    on_idle:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 0, duration: 1.0s}
    on_play:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 0, duration: 1.0s}

# mono_dac: the MAX98357A analog-sums L+R, so "Stereo" would be an undefined mix and
# one-sided inversion of duplicated content would cancel to silence.
select:
  - platform: snapclient
    type: channel_mode
    snapclient_id: snap
    name: Channel Mode
    mono_dac: true
  - platform: snapclient
    type: phase
    snapclient_id: snap
    name: Phase
    mono_dac: true
  - platform: snapclient
    type: pause_behavior
    snapclient_id: snap
    name: Pause Behavior
  - platform: snapclient
    type: server
    snapclient_id: snap
    name: Server
  # Roam scans take the radio off-channel for hundreds of ms; a pinned AP also guarantees
  # a stereo pair shares one TSF timebase.
  - platform: wifi_bssid_select
    name: Access Point

text:
  - platform: snapclient          # manual "host[:port]"; highest precedence
    snapclient_id: snap
    name: Server Override

text_sensor:
  - platform: snapclient
    type: stream_format           # the check for the pipeline rates above
    snapclient_id: snap
    name: Stream Format
  - platform: snapclient
    type: tsf_role
    snapclient_id: snap
    name: TSF Role
  # Now-playing from the server's control API; empty when it is disabled
  - platform: snapclient
    type: stream_title
    snapclient_id: snap
    name: Track Title
  - platform: snapclient
    type: stream_artist
    snapclient_id: snap
    name: Track Artist
  - platform: snapclient
    type: stream_album
    snapclient_id: snap
    name: Track Album
  - platform: snapclient
    type: stream_name
    snapclient_id: snap
    name: Stream
  - platform: wifi_info
    bssid:
      name: WiFi BSSID
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: WiFi RSSI
    update_interval: 30s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_rssi
    name: WiFi Signal Quality
    filters:
      - lambda: return std::clamp(2.0f * (x + 100.0f), 0.0f, 100.0f);   # -100..-50 dBm
    unit_of_measurement: "%"
    device_class: ""
    entity_category: diagnostic

number:
  - platform: snapclient
    type: server_latency          # server-persisted; stays in sync with snapweb
    snapclient_id: snap
    name: Server Latency
  # SuperMini antennas distort at high power, so LOWER often connects better. The driver
  # quantizes and clamps the request, so only the readback set_max_tx_power logs is real.
  - platform: template
    name: WiFi TX Power
    id: wifi_tx_power
    icon: mdi:wifi-strength-2
    entity_category: config
    unit_of_measurement: dBm
    min_value: 2.0
    max_value: 20.5
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 8.5
    set_action:
      - lambda: wifi_tools::set_max_tx_power(x);

button:
  # Re-anchors the playout accounting: the reliable remedy for a device that has latched
  # a timing offset with clean-looking metrics, and the way out of a stuck ANNOUNCING.
  - platform: restart
    name: Restart
    entity_category: config

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: ${pin_led}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    name: Status LED
    default_transition_length: 200ms

# RSSI plus the negotiated PHY mode every 10 s; a fallback from HT20 to 11G/11B is the
# classic marginal-link tell, and it lands next to the sync report on one timeline.
wifi_tools:
  diagnostics:
    update_interval: 10s

interval:
  # Guarded on transitions: an unconditional turn_on republishes every tick, spamming
  # the API and HA's recorder.
  - interval: 1s
    then:
      - if:
          condition:
            and: [media_player.is_playing: player, light.is_off: status_led]
          then:
            - light.turn_on: {id: status_led, brightness: 20%, red: 0%, green: 100%, blue: 20%}
      - if:
          condition:
            and: [not: {media_player.is_playing: player}, light.is_on: status_led]
          then:
            - light.turn_off: status_led
