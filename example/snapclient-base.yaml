# Shared config for a real multiroom speaker. Board files include this as a package and
# supply the substitutions; everything hardware-specific lives there.
#
#   name / friendly_name              node identity
#   board / flash_size                esp32 platform
#   psram_mode / psram_speed
#   pin_lrclk / pin_bclk / pin_dout   I2S to the DAC
#   pin_led                           onboard WS2812, used as a play-state indicator
#
# Snapcast mixed with Home Assistant announcements: a `mixer` speaker blends two source
# speakers into the DAC, the media pipeline plays Snapcast plus arbitrary URLs, and the
# announcement pipeline plays over the top — ducking the music rather than stopping it,
# so Snapcast stays connected and in sync throughout.
#
# For the complete option list see snapclient-example.yaml.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Appends the MAC's last 3 bytes, so a fleet can share this config and stay
  # distinguishable in HA, mDNS and on the snapserver (Hello HostName derives from it)
  name_add_mac_suffix: true

esp32:
  board: ${board}
  flash_size: ${flash_size}
  framework:
    type: esp-idf
    sdkconfig_options:
      # Raises the PHY TX-power ceiling independently of wifi.output_power, which cannot
      # be done through output_power alone: esp32 derives the ceiling from it as
      # max(10, min(20, ceil(output_power))). We want a LOW boot power (a poorly matched
      # antenna misassociates at high power) with a HIGH ceiling, so the runtime "WiFi TX
      # Power" number can explore above 10 dBm.
      CONFIG_ESP_PHY_MAX_WIFI_TX_POWER: "20"

psram:
  mode: ${psram_mode}
  speed: ${psram_speed}

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

# output_power is per board, so board files add it via their own wifi: block, which
# merges with this one. It is a FLOOR, not a cap: esp32 has no default, so omitting it
# removes the boot-time call and the radio comes up at the PHY maximum. That left two of
# four SuperMinis dropping every chunk with multi-second sync error and never
# recovering — nothing lowered the power, and the runtime number's restore ran too late.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  # audio_timing is AUTO_LOADed by snapclient but a `components:` filter hides anything
  # it does not name; wifi_tools and wifi_bssid_select are used below.
  - source: github://W-Floyd/esphome-snapcast
    components: [snapclient, audio_timing, wifi_tools, wifi_bssid_select]
  # Working tree instead:
  # - source: {type: local, path: ../components}

  # Forked speaker stack: adds `Speaker::buffered_bytes()`, letting the sync engine see
  # the audio between our push point and the DAC. Drop once upstream — see TODO.md.
  - source:
      type: git
      url: https://github.com/W-Floyd/esphome
      ref: speaker-buffered-bytes
    components: [speaker, i2s_audio, mixer, audio, media_source, speaker_source]

snapclient:
  id: snap
  # server: 192.168.1.10        # omit to discover via mDNS
  # These are fixed multiroom players, so the stream decides — not whatever last touched
  # the media player entity. `ignore` refuses PAUSE and STOP outright, so there is no
  # audible gap; `resume` would accept them and undo them seconds later, meaning silence
  # then a restart. Trade-off: a deliberate stop is refused too, so a "turn everything
  # off" automation cannot silence these — but nor can it strand one idle until somebody
  # presses play, which is what happened before this existed.
  pause_behavior: ignore
  rate_lock:
    i2s_audio_id: i2s_out       # by id: ESPHome does not number buses in
                                # declaration order (a PDM mic takes port 0)
  tsf_sync: true                # same-AP clients share one server→TSF mapping
  timing_diagnostics: false     # ~38 log lines/s/device; on to measure, off to listen

media_source:
  - platform: snapclient        # synchronized multiroom audio
    id: snap_source
    snapclient_id: snap
    # static_delay: 0ms         # per-device latency trim
  - platform: audio_http        # HA "play media", radio streams
    id: media_http_source
  - platform: audio_http        # HA announcements / TTS
    id: announcement_http_source

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: ${pin_lrclk}
    i2s_bclk_pin: ${pin_bclk}

speaker:
  - platform: i2s_audio
    id: dac_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: ${pin_dout}
    sample_rate: 44100
    channel: stereo
    buffer_duration: 100ms
    # Never stop on a data gap: the 500 ms default tears down and rebuilds the
    # speaker/mixer rings, escalating a brief hiccup into a multi-second dropout.
    timeout: never
  - platform: mixer
    output_speaker: dac_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      # The snapclient writes here, so this is the timeout that matters: at the default
      # a hiccup stops the source, the mixer rebuilds, and the pipeline returns at a
      # DIFFERENT fill (observed 250 ms -> 100 ms, permanent, sync error still ~0 —
      # i.e. silently offset from its peers).
      - id: media_mixer_input
        timeout: never

media_player:
  - platform: speaker_source
    id: player
    name: Media Player
    volume_initial: 0.6
    media_pipeline:
      speaker: media_mixer_input
      sources: [snap_source, media_http_source]
      # Match the snapserver stream exactly — nothing here resamples. This said 48000
      # against a server streaming 44100; check yours with the Stream Format sensor.
      sample_rate: 44100
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_mixer_input
      sources: [announcement_http_source]
      # MUST match the media pipeline: the mixer neither resamples nor up-mixes. This
      # was 48000/mono against 44100/stereo — wrong on both axes — and HA's ffmpeg_proxy
      # faithfully delivered what was asked for, so the mixer rejected it with
      # "Incompatible audio streams", the player stuck in ANNOUNCING, and it retried
      # forever: 1742 ring buffers in under two minutes, needing a reboot.
      sample_rate: 44100
      num_channels: 2
    # Duck rather than pause, so Snapcast keeps playing and stays in sync
    on_announcement:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 20, duration: 0.0s}
    on_idle:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 0, duration: 1.0s}
    on_play:
      - mixer_speaker.apply_ducking: {id: media_mixer_input, decibel_reduction: 0, duration: 1.0s}

select:
  # mono_dac: the MAX98357A analog-sums L+R, so "Stereo" would be an undefined mix and
  # single-side inversion of duplicated content would cancel to silence. Both entities
  # collapse their options accordingly.
  - platform: snapclient
    type: channel_mode
    snapclient_id: snap
    name: Channel Mode
    mono_dac: true
  - platform: snapclient
    type: phase
    snapclient_id: snap
    name: Phase
    mono_dac: true
  - platform: snapclient
    type: pause_behavior          # switch "the group decides" vs "the buttons work"
    snapclient_id: snap
    name: Pause Behavior
  - platform: snapclient
    type: server                  # "Automatic" + each mDNS result
    snapclient_id: snap
    name: Server
  # Pin to one AP: mid-stream roam scans take the radio off-channel for hundreds of ms,
  # and a pinned AP guarantees a stereo pair shares one TSF timebase.
  - platform: wifi_bssid_select
    name: Access Point

text:
  - platform: snapclient          # manual "host[:port]"; highest precedence
    snapclient_id: snap
    name: Server Override

text_sensor:
  # What the server is actually sending — the check for the pipeline rates above
  - platform: snapclient
    type: stream_format
    snapclient_id: snap
    name: Stream Format
  - platform: snapclient
    type: tsf_role                # Leader / Follower / Inactive
    snapclient_id: snap
    name: TSF Role
  # Now-playing metadata from the server's control API; empty when the control port is
  # disabled or the stream carries none
  - platform: snapclient
    type: stream_title
    snapclient_id: snap
    name: Track Title
  - platform: snapclient
    type: stream_artist
    snapclient_id: snap
    name: Track Artist
  - platform: snapclient
    type: stream_album
    snapclient_id: snap
    name: Track Album
  - platform: snapclient
    type: stream_name
    snapclient_id: snap
    name: Stream
  - platform: wifi_info
    bssid:
      name: WiFi BSSID
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: WiFi RSSI
    update_interval: 30s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_rssi
    name: WiFi Signal Quality
    filters:
      - lambda: return std::clamp(2.0f * (x + 100.0f), 0.0f, 100.0f);   # -100..-50 dBm
    unit_of_measurement: "%"
    device_class: ""
    entity_category: diagnostic

number:
  # Server-persisted and pushed back in ServerSettings, so this stays in sync even when
  # changed from snapweb — the canonical per-room delay trim.
  - platform: snapclient
    type: server_latency
    snapclient_id: snap
    name: Server Latency
  # SuperMini antennas distort at high power, so LOWER often connects better. Persisted,
  # and the only place power should be set at runtime; the driver quantizes and clamps
  # the request, so the readback logged by set_max_tx_power is the meaningful value.
  - platform: template
    name: WiFi TX Power
    id: wifi_tx_power
    icon: mdi:wifi-strength-2
    entity_category: config
    unit_of_measurement: dBm
    min_value: 2.0
    max_value: 20.5
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 8.5
    set_action:
      - lambda: wifi_tools::set_max_tx_power(x);

button:
  # A restart re-anchors the playout accounting, which is the reliable remedy for a
  # device that has latched a timing offset and sits audibly behind its peers with
  # clean-looking metrics. Also the fastest way out of a stuck ANNOUNCING state.
  - platform: restart
    name: Restart
    entity_category: config

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: ${pin_led}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: Status LED
    default_transition_length: 200ms

# RSSI plus the negotiated PHY mode every 10 s at DEBUG; a fallback from HT20 down to
# 11G/11B is the classic marginal-link tell, and it sits next to the sync report so a
# stall's cause reads off one timeline.
wifi_tools:
  diagnostics:
    update_interval: 10s

interval:
  # Play-state LED, guarded on transitions: an unconditional turn_on republishes the
  # light state every tick, spamming the API and HA's recorder.
  - interval: 1s
    then:
      - if:
          condition:
            and: [media_player.is_playing: player, light.is_off: status_led]
          then:
            - light.turn_on: {id: status_led, brightness: 20%, red: 0%, green: 100%, blue: 20%}
      - if:
          condition:
            and: [not: {media_player.is_playing: player}, light.is_on: status_led]
          then:
            - light.turn_off: status_led
