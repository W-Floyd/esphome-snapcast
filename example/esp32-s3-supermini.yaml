# Smart speaker on an ESP32-S3 SuperMini (ESP32-S3FH4R2: 4 MB flash, 2 MB quad PSRAM):
# synchronized Snapcast playback mixed with Home Assistant announcements (TTS,
# doorbells, etc.), following the upstream sendspin/speaker_source pattern:
#
#   - a `mixer` speaker blends two source speakers into the physical I2S DAC
#   - the media pipeline plays the snapclient source (plus arbitrary HTTP URLs)
#   - the announcement pipeline plays HA announcements over the top, ducking the
#     music instead of stopping it — Snapcast stays connected and in sync throughout
#
# I2S DAC (PCM5102A / MAX98357A style) on the Speakeasy OTS / Lowcost PCB pinout:
#
#   GPIO4  -> LCK  (word select / LR clock)
#   GPIO5  -> BCK  (bit clock)
#   GPIO6  -> DIN  (data)
#
# The onboard WS2812 (GPIO48) doubles as a play-state indicator.
esphome:
  name: snapclient-supermini
  friendly_name: Snapclient SuperMini
  includes:
    - <esp_wifi.h>  # for the WiFi TX Power slider's esp_wifi_set_max_tx_power call

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

# The SuperMini's ESP32-S3FH4R2 has 2 MB embedded QUAD PSRAM (not octal)
psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # SuperMini boards have a poorly matched antenna that distorts at full TX power,
  # causing "Auth Expired" loops even at full RX bars. Reduced power is the known fix.
  output_power: 8.5dB
  on_connect:
    # Re-apply a persisted AP lock. This must run from on_connect, never before the
    # first connection: get_sta() returns the AP *selected during connection* and is
    # an empty config until then — stamping a BSSID onto it would wipe the real
    # credentials. First connect is therefore unlocked; if it landed on the wrong AP,
    # this locks and reconnects once.
    - lambda: |-
        if (id(locked_bssid) == 0)
          return;
        auto *w = wifi::global_wifi_component;
        wifi::bssid_t target;
        uint64_t packed = id(locked_bssid);
        for (int i = 5; i >= 0; i--) { target[i] = packed & 0xFF; packed >>= 8; }
        wifi::WiFiAP ap = w->get_sta();
        if (ap.get_ssid().empty()) {
          ESP_LOGW("wifi_lock", "No selected STA config; not applying lock");
          return;
        }
        ap.set_bssid(target);
        w->set_sta(ap);
        if (w->wifi_bssid() != target) {
          ESP_LOGI("wifi_lock", "Connected to wrong AP; reconnecting to locked %02X:%02X:%02X:%02X:%02X:%02X",
                   target[0], target[1], target[2], target[3], target[4], target[5]);
          w->retry_connect();
        }

external_components:
  - source:
      type: local
      path: ../components
  # When using this repo remotely instead:
  # - source: github://W-Floyd/snapclient-esphome
  #   components: [snapclient]

snapclient:
  id: snap
  # server: 192.168.1.10 # omit to auto-discover via mDNS (_snapcast._tcp)
  # buffer_size: 524288  # fits comfortably in the 2 MB PSRAM
  # static_delay is set on the media_source below

media_source:
  # Synchronized multiroom audio
  - platform: snapclient
    id: snap_source
    snapclient_id: snap
    # static_delay: 0ms  # per-device latency trim
  # Direct URL playback (HA "play media", radio streams) on the media pipeline
  - platform: audio_http
    id: media_http_source
  # HA announcements / TTS on the announcement pipeline
  - platform: audio_http
    id: announcement_http_source

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO4
    i2s_bclk_pin: GPIO5

speaker:
  # The physical DAC
  - platform: i2s_audio
    id: dac_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO6
    sample_rate: 48000
    channel: stereo
    buffer_duration: 100ms
  # Blend announcements over the music
  - platform: mixer
    output_speaker: dac_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

media_player:
  - platform: speaker_source
    id: player
    name: Media Player
    volume_initial: 0.6
    media_pipeline:
      speaker: media_mixer_input
      sources:
        - snap_source
        - media_http_source
      # Match the snapserver stream format so the DAC feedback used for
      # synchronization counts frames 1:1 with what the snapclient source pushes
      sample_rate: 48000
      num_channels: 2
    announcement_pipeline:
      speaker: announcement_mixer_input
      sources:
        - announcement_http_source
      sample_rate: 48000
      num_channels: 1
    # Duck the music under announcements instead of pausing it; Snapcast keeps
    # playing (and stays in sync) at reduced volume, then ramps back up
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 20
          duration: 0.0s
    on_idle:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 1.0s
    on_play:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 1.0s

# Channel routing (Stereo / Left / Right / Mono), e.g. for using two devices as a
# synchronized L/R pair. Persisted across reboots.
select:
  - platform: snapclient
    snapclient_id: snap
    name: Channel Mode
# Pin the client to whichever AP it is currently connected to — no hardcoded BSSIDs.
# Mid-stream roam scans take the radio off-channel for hundreds of ms and starve
# playback; roaming is already suppressed while streaming, and the lock removes AP
# switching entirely. The captured BSSID persists across reboots (0 = auto).
globals:
  - id: locked_bssid
    type: uint64_t
    restore_value: true
    initial_value: '0'

switch:
  - platform: template
    name: Lock to Current AP
    id: ap_lock_switch
    icon: mdi:router-wireless-settings
    entity_category: config
    # State comes from the persisted global; never restore-and-replay the actions at
    # boot (a replayed turn_off ran set_sta() on the empty pre-connect config and
    # wiped the wifi credentials)
    restore_mode: DISABLED
    lambda: return id(locked_bssid) != 0;
    turn_on_action:
      - lambda: |-
          auto *w = wifi::global_wifi_component;
          if (!w->is_connected()) {
            ESP_LOGW("wifi_lock", "Not connected; nothing to lock to");
            return;
          }
          wifi::WiFiAP ap = w->get_sta();
          if (ap.get_ssid().empty()) {
            ESP_LOGW("wifi_lock", "No selected STA config; not locking");
            return;
          }
          wifi::bssid_t bssid = w->wifi_bssid();
          uint64_t packed = 0;
          for (uint8_t b : bssid) packed = (packed << 8) | b;
          id(locked_bssid) = packed;
          ap.set_bssid(bssid);
          w->set_sta(ap);
          ESP_LOGI("wifi_lock", "Locked to current AP %02X:%02X:%02X:%02X:%02X:%02X",
                   bssid[0], bssid[1], bssid[2], bssid[3], bssid[4], bssid[5]);
    turn_off_action:
      - lambda: |-
          id(locked_bssid) = 0;
          auto *w = wifi::global_wifi_component;
          wifi::WiFiAP ap = w->get_sta();
          if (ap.get_ssid().empty()) {
            // Nothing selected yet (e.g. before first connect): the lock was never
            // applied this session, clearing the global is enough
            return;
          }
          ap.clear_bssid();
          w->set_sta(ap);
          ESP_LOGI("wifi_lock", "AP lock cleared (auto selection)");

text_sensor:
  # Shows which AP the device is on (and thus what the lock would capture)
  - platform: wifi_info
    bssid:
      name: WiFi BSSID
      entity_category: diagnostic

sensor:
  # RSSI in dBm plus a friendlier 0-100% quality reading
  - platform: wifi_signal
    id: wifi_rssi
    name: WiFi RSSI
    update_interval: 30s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_rssi
    name: WiFi Signal Quality
    filters:
      # Standard mapping: -100 dBm -> 0%, -50 dBm -> 100%
      - lambda: return std::clamp(2.0f * (x + 100.0f), 0.0f, 100.0f);
    unit_of_measurement: "%"
    device_class: ""
    entity_category: diagnostic

# Runtime WiFi TX power tuning (pattern from speakeasy's wifi-9ramp.yaml). SuperMini
# antennas distort at high power, so LOWER often connects better; find the sweet spot
# from HA without reflashing. Persisted; wifi.output_power above only covers boot
# until this restores. (Speakeasy's step-up-on-disconnect ramp is deliberately not
# copied: on this board raising power is usually what breaks the link.)
number:
  - platform: template
    name: WiFi TX Power
    id: wifi_tx_power
    icon: mdi:wifi-strength-2
    entity_category: config
    unit_of_measurement: dBm
    min_value: 2.0
    max_value: 20.5
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 8.5
    set_action:
      - lambda: |-
          esp_wifi_set_max_tx_power((int8_t)(x * 4));
          ESP_LOGI("wifi_tx", "WiFi TX power set to %.2f dBm", x);

# Onboard WS2812 as a play-state indicator
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    name: Status LED
    default_transition_length: 200ms

interval:
  # Radio-link forensics every 10 s at DEBUG: live RSSI, the negotiated PHY mode
  # (a fallback from HT20/11g down to 11b is the classic marginal-link tell), and
  # the driver's RX/TX statistics dump — which includes retry counters, so a stall's
  # cause (retries vs starvation vs roam) shows up next to the player's sync report.
  - interval: 10s
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected())
            return;
          int rssi = 0;
          esp_wifi_sta_get_rssi(&rssi);
          wifi_phy_mode_t phymode;
          static const char *PHY_NAMES[] = {"LR", "11B", "11G", "11A", "HT20", "HT40", "HE20", "VHT20"};
          const char *phy = esp_wifi_sta_get_negotiated_phymode(&phymode) == ESP_OK && phymode <= WIFI_PHY_MODE_VHT20
                                ? PHY_NAMES[phymode]
                                : "?";
          ESP_LOGD("wifi_diag", "rssi=%d dBm, phymode=%s", rssi, phy);
          // Driver TX/RX counters (incl. retries); prints via the esp-idf log
          esp_wifi_statis_dump(WIFI_STATIS_RXTX | WIFI_STATIS_HW);
  - interval: 1s
    then:
      - if:
          condition:
            media_player.is_playing: player
          then:
            - light.turn_on:
                id: status_led
                brightness: 20%
                red: 0%
                green: 100%
                blue: 20%
          else:
            - light.turn_off: status_led
